<!DOCTYPE html>
<html lang="ja">
<head><meta charset="utf-8"><title>確認: お手本の窓の子どもの解説</title>
<style>html, body { margin: 0; height: 100%; } iframe { border: 0; width: 100%; height: 100%; }</style></head>
<body>
<!-- お手本の窓に子どもの解説の本文が出るかを見るための確認用ページ。アプリ本体を読み込み、?model= のお手本の窓を開く(秘密の情報は使わない) -->
<iframe id="app" src="../../index.html"></iframe>
<script>
  const model = new URLSearchParams(location.search).get('model') || 'bach';
  document.getElementById('app').addEventListener('load', () => {
    setTimeout(() => {
      const w = document.getElementById('app').contentWindow;
      try { w.LyraMidi.openDemo(model); } catch (err) { document.title = 'エラー: ' + err.message; }
    }, 1500);
  });
</script>
</body>
</html>
