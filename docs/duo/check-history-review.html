<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>確認: 音楽史マップの監修の印</title>
<style>
  body { font: 13px/1.6 sans-serif; margin: 16px; }
  iframe { width: 100%; height: 640px; border: 1px solid #ccc; }
  pre { white-space: pre-wrap; background: #f6f3ec; padding: 8px; }
</style>
</head>
<body>
<h1>音楽史マップの監修の印の確認</h1>
<p>アプリ(index.html)を下に読み込み、<code>models/review/index.json</code> の応答だけ模擬データに差し替える。サインイン・Drive・Gemini は使わない。最後は模擬データで地図を開いたままにする。</p>
<pre id="out">実行中…</pre>
<iframe id="app" src="../../index.html?check=history-review"></iframe>
<script>
(async function () {
  const out = document.getElementById('out');
  const log = [];
  const ok = (name, cond, extra) => log.push(`${cond ? 'OK ' : 'NG '} ${name}${extra != null ? ` (${extra})` : ''}`);
  const entry = (status, issues = [], counts = {}) => ({
    status, reviewedAt: '2026-11-09', reviewer: 'Claude Code(別のセッション)',
    counts: { ok: 3, overstated: 0, wrong: 0, unsure: 1, ...counts }, sources: 5, noSource: 0, issues,
  });
  const MOCK = { version: 1, models: {
    ives: entry('issues', [
      { fields: ['kids'], verdict: 'wrong', claim: '<img src=x>模擬の誤りの主張', suggestion: '模擬の直し方の案', sources: 0 },
      { fields: ['text'], verdict: 'overstated', claim: '模擬の言い過ぎの主張', suggestion: '模擬の案', sources: 2 },
    ], { overstated: 1, wrong: 1 }),
    webern: entry('clean'),
    feldman: entry('fixed', [{ fields: ['style'], verdict: 'wrong', claim: '模擬の直した主張', suggestion: '案', sources: 1, fixed: '2026-11-09' }], { wrong: 1 }),
    satie: entry('stale'),
  } };
  const frame = document.getElementById('app');
  await new Promise((r) => frame.addEventListener('load', r, { once: true }));
  const win = frame.contentWindow;
  const errors = [];
  win.addEventListener('error', (e) => errors.push(e.message));
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  for (let i = 0; i < 80 && !(win.LyraMidi && win.LyraMidi.pickModel && win.LyraHistoryMap); i++) await wait(100);
  const doc = win.document;
  const waitFor = async (fn) => { for (let i = 0; i < 60 && !fn(); i++) await wait(100); return fn(); };

  const realFetch = win.fetch.bind(win);
  let reviewResponse = () => new win.Response(JSON.stringify(MOCK), { status: 200 });
  win.fetch = (url, opts) => (String(url).includes('models/review/index.json') ? Promise.resolve().then(reviewResponse) : realFetch(url, opts));

  async function openMap() {
    win.eval('state.prefs.pinnedModels = []');
    win.LyraMidi.pickModel('確認');
    await wait(80);
    doc.querySelector('.model-picker [data-history-map]').click();
    await waitFor(() => doc.querySelector('.history-map-overlay .history-map-row'));
    return doc.querySelector('.history-map-overlay');
  }
  function closeMap() {
    doc.querySelector('.history-map-overlay [data-history-close]').click();
    const picker = doc.querySelector('.model-picker');
    if (picker) picker.closest('.modal-overlay').remove();
  }
  const row = (o, id) => o.querySelector(`[data-history-id="${id}"]`);
  const badge = (o, id) => row(o, id).querySelector('.history-map-review');

  try {
    // 1. index.json が無い
    reviewResponse = () => new win.Response('', { status: 404 });
    let o = await openMap();
    ok('索引が 404 でも地図が212件開く', o.querySelectorAll('.history-map-row').length === 212);
    ok('印は1つも出ない', !o.querySelector('.history-map-review'));
    closeMap();

    // 2. index.json が壊れている
    reviewResponse = () => new win.Response('{こわれた', { status: 200 });
    o = await openMap();
    ok('索引が壊れていても地図が212件開く', o.querySelectorAll('.history-map-row').length === 212);
    closeMap();

    // 3. 通信が失敗する
    reviewResponse = () => Promise.reject(new Error('失敗'));
    o = await openMap();
    ok('通信が失敗しても地図が212件開く', o.querySelectorAll('.history-map-row').length === 212);
    closeMap();

    // 4. 模擬の記録
    reviewResponse = () => new win.Response(JSON.stringify(MOCK), { status: 200 });
    o = await openMap();
    ok('指摘ありの印が文字で出る', badge(o, 'ives')?.textContent === '監修: 指摘あり', badge(o, 'ives')?.textContent);
    ok('指摘なしの印', badge(o, 'webern')?.textContent === '監修: 指摘なし');
    ok('直したの印', badge(o, 'feldman')?.textContent === '監修: 直した');
    ok('文が変わったの印', badge(o, 'satie')?.textContent === '監修: 監修の後に文が変わった');
    ok('未監修の行に印が無い', !badge(o, 'bach'));
    ok('印は監修の4件だけ', o.querySelectorAll('.history-map-review').length === 4);

    row(o, 'ives').querySelector('.history-map-toggle').click();
    const detail = row(o, 'ives').querySelector('.history-map-review-detail');
    ok('詳細が開いて見える', !row(o, 'ives').querySelector('.history-map-detail').hidden);
    ok('詳細に状態と件数', /指摘あり/.test(detail.textContent) && /主張 6/.test(detail.textContent) && /判断できず 1/.test(detail.textContent) && /出典 5/.test(detail.textContent), detail.textContent.replace(/\s+/g, ' '));
    ok('指摘の要約が2件', detail.querySelectorAll('li').length === 2);
    ok('出典の無い指摘は「出典なし」', /出典なし/.test(detail.querySelector('li').textContent));
    ok('判定の言葉が出る', detail.querySelector('li b').textContent === '誤り');
    ok('記録の文をエスケープする', !detail.querySelector('img') && /<img/.test(detail.textContent));
    ok('未監修の詳細は「まだ」', /監修 まだ/.test(row(o, 'bach').querySelector('.history-map-detail').textContent));

    const filter = o.querySelector('[data-history-filter="reviewIssues"]');
    ok('絞り込みのボタンがある', Boolean(filter));
    filter.click();
    const visible = [...o.querySelectorAll('.history-map-row')].filter((r) => !r.hidden).map((r) => r.dataset.historyId);
    ok('「監修の指摘あり」で ives だけ', visible.join() === 'ives', visible.join());
    o.querySelector('[data-history-filter="all"]').click();
    ok('元に戻せる', [...o.querySelectorAll('.history-map-row')].filter((r) => !r.hidden).length === 212);

    // 5. スマホの幅
    frame.style.width = '375px';
    await wait(150);
    const modal = o.querySelector('.history-map');
    ok('スマホの幅で横にはみ出さない', modal.scrollWidth <= modal.clientWidth + 1, `${modal.scrollWidth} / ${modal.clientWidth}`);
    frame.style.width = '';
    row(o, 'ives').scrollIntoView({ block: 'start' });
    ok('エラーなし', errors.length === 0, errors.join(' / '));
  } catch (error) {
    ok(`途中で例外: ${error.message}`, false);
  }
  const ngs = log.filter((line) => line.startsWith('NG')).length;
  out.textContent = `${ngs ? `NG ${ngs} 件` : '全項目 OK'}\n${log.join('\n')}`;
  document.title = ngs ? 'NG' : 'OK';
})();
</script>
</body>
</html>
