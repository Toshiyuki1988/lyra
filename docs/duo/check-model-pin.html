<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>確認: モデルのピン留めと絞り込み</title>
<style>
  body { font: 13px/1.6 sans-serif; margin: 16px; }
  iframe { width: 100%; height: 640px; border: 1px solid #ccc; }
  pre { white-space: pre-wrap; background: #f6f3ec; padding: 8px; }
</style>
</head>
<body>
<h1>モデルのピン留めと絞り込み(2026-11-07)</h1>
<p>アプリ(index.html)を下に読み込み、モデルのピッカーを開いて、ピン・絞り込み・検索・解説・選択を順に押す。サインイン・Drive・Gemini は使わない。
ピン留めは保存前(読み込み前)の state にだけ入り、Drive には書かない(保存の防波堤 <code>dataLoaded</code> で止まる)。</p>
<pre id="out">実行中…</pre>
<iframe id="app" src="../../index.html?check=pin"></iframe>
<script>
(async function () {
  const out = document.getElementById('out');
  const log = [];
  const ok = (name, cond, extra) => log.push(`${cond ? 'OK ' : 'NG '} ${name}${extra != null ? ` (${extra})` : ''}`);
  const frame = document.getElementById('app');
  await new Promise((r) => frame.addEventListener('load', r, { once: true }));
  const win = frame.contentWindow;
  const errors = [];
  win.addEventListener('error', (e) => errors.push(e.message));
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  for (let i = 0; i < 50 && !(win.LyraMidi && win.LyraMidi.pickModel); i++) await wait(100);
  const doc = win.document;
  try {
    win.localStorage.removeItem('lyra.modelFilter');
    win.eval('state.prefs.pinnedModels = []');
    const picked = win.LyraMidi.pickModel('確認');
    await wait(50);
    const modal = doc.querySelector('.model-picker');
    ok('ピッカーが開く', Boolean(modal));
    const items = () => [...modal.querySelectorAll('.model-list [data-model]')];
    const total = items().length;
    ok('全部のモデルが並ぶ', total > 50, `${total} 件`);
    ok('近代・戦後の見出しがある', [...modal.querySelectorAll('.model-group-name')].some((g) => g.textContent === '近代・戦後'));
    ok('最初はピン留めの見出しが無い', !modal.querySelector('.model-group--pinned'));
    ok('ピンのボタンが全部のモデルにある', modal.querySelectorAll('.model-list [data-pin]').length === total);

    modal.querySelector('[data-pin="ives"]').click();
    await wait(30);
    ok('ピンを押してもピッカーは閉じない', doc.body.contains(modal));
    const pinnedGroup = modal.querySelector('.model-group--pinned');
    ok('ピン留めの見出しが先頭に出る', pinnedGroup && modal.querySelector('.model-list').firstElementChild === pinnedGroup);
    ok('ピン留めの見出しに ives がある', pinnedGroup && pinnedGroup.querySelector('[data-model="ives"]'));
    ok('ピンの数が1', modal.querySelector('[data-pin-count]').textContent === '1');
    ok('state.prefs に残る', JSON.stringify(win.eval('state.prefs.pinnedModels')) === '["ives"]');
    modal.querySelector('[data-pin="satie"]').click();
    await wait(30);
    ok('2つ目のピン', modal.querySelector('[data-pin-count]').textContent === '2');

    modal.querySelector('[data-model-view="pinned"]').click();
    await wait(30);
    ok('「ピン留め」でピン留めだけになる', items().map((b) => b.dataset.model).join(',') === 'ives,satie', items().map((b) => b.dataset.model).join(','));
    ok('絞り込みの状態を覚える', JSON.parse(win.localStorage.getItem('lyra.modelFilter')).view === 'pinned');

    modal.querySelector('.model-group--pinned [data-pin="ives"]').click();
    await wait(30);
    ok('ピン留めの一覧から外せる', items().map((b) => b.dataset.model).join(',') === 'satie');
    modal.querySelector('.model-group--pinned [data-pin="satie"]').click();
    await wait(30);
    const empty = modal.querySelector('.model-empty');
    ok('全部外すと案内が出る', !empty.hidden && /ピン/.test(empty.textContent), empty.textContent);

    modal.querySelector('[data-model-view="all"]').click();
    const sel = modal.querySelector('[data-model-group]');
    sel.value = '近代・戦後';
    sel.dispatchEvent(new win.Event('change'));
    await wait(30);
    const modern = win.LyraPresets.PRESETS.filter((p) => !p.hidden && p.group === '近代・戦後').length;
    ok('見出しで絞り込める', items().length === modern, `${items().length} / ${modern}`);
    const search = modal.querySelector('[data-model-search]');
    search.value = 'アイヴズ';
    search.dispatchEvent(new win.Event('input'));
    await wait(30);
    ok('検索で絞り込める', items().map((b) => b.dataset.model).join(',') === 'ives', items().map((b) => b.dataset.model).join(','));
    search.value = 'あいうえおかきくけこ';
    search.dispatchEvent(new win.Event('input'));
    await wait(30);
    ok('該当なしの案内', !empty.hidden && empty.textContent === '該当するモデルがありません');
    search.value = '';
    search.dispatchEvent(new win.Event('input'));
    sel.value = '';
    sel.dispatchEvent(new win.Event('change'));
    await wait(30);
    ok('絞り込みを戻すと全部', items().length === total);

    const kid = modal.querySelector('[data-kids="ives"]');
    kid.click();
    await wait(30);
    const pop = doc.querySelector('.kids-pop');
    ok('解説を押すと吹き出しが出る', pop && !pop.hidden && /お祭り/.test(pop.textContent));
    ok('解説を押してもピッカーは閉じない', doc.body.contains(modal));

    let resolved = 'まだ';
    picked.then((id) => { resolved = id; });
    modal.querySelector('[data-model="whole_tone"]').click();
    await wait(30);
    ok('モデルを押すと選ばれて閉じる', resolved === 'whole_tone' && !doc.body.contains(modal), resolved);

    // 次に開いた時、見出しの絞り込みを覚えている
    win.localStorage.setItem('lyra.modelFilter', JSON.stringify({ view: 'all', group: '近代・戦後' }));
    const p2 = win.LyraMidi.pickModel('確認2');
    await wait(50);
    const m2 = doc.querySelector('.model-picker');
    ok('開き直すと見出しの絞り込みが残る', m2.querySelector('[data-model-group]').value === '近代・戦後');
    m2.querySelector('[data-cancel]').click();
    ok('やめると null', (await p2) === null);
    win.localStorage.removeItem('lyra.modelFilter');
    win.eval('state.prefs.pinnedModels = []');
  } catch (err) {
    log.push(`NG 例外: ${err.message}`);
  }
  ok('画面の読み込みエラーが無い', !errors.length, errors.join(' / '));
  const ng = log.filter((x) => x.startsWith('NG')).length;
  out.textContent = `結果: ${ng ? `NG ${ng} 件` : 'すべて OK'}\n` + log.join('\n');
  out.dataset.done = '1';
  // ?keep=1: 見た目の確認用に、2つピン留めしたピッカーを開いたままにする(Drive には保存されない)
  if (/keep=1/.test(location.search)) {
    // 見た目だけを撮るため、結果と説明を隠してアプリを全面に出す
    [...document.body.children].forEach((el) => { if (el !== frame) el.hidden = true; });
    document.body.style.margin = '0';
    frame.style.cssText = 'width:100vw;height:100vh;border:0;display:block';
    win.eval('state.prefs.pinnedModels = ["ives", "satie"]');
    win.LyraMidi.pickModel('どのモデルで作りますか?');
  }
})();
</script>
</body>
</html>
