<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>確認: 音楽史マップのピン留め</title>
<style>
  body { font: 13px/1.6 sans-serif; margin: 16px; }
  iframe { width: 100%; height: 640px; border: 1px solid #ccc; }
  pre { white-space: pre-wrap; background: #f6f3ec; padding: 8px; }
</style>
</head>
<body>
<h1>音楽史マップのピン留め(2026-11-07)</h1>
<p>アプリ(index.html)を下に読み込み、モデルのピッカー → 音楽史マップを開いて、地図でピンを押し、閉じた時にピッカーのピン留めに出るかを確かめる。
サインイン・Drive・Gemini は使わない。ピン留めは読み込み前の state にだけ入り、Drive には書かない(保存の防波堤 <code>dataLoaded</code> で止まる)。
<code>?keep=1</code> を付けると、最後に地図を開いたままにする(見た目の確認用)。</p>
<pre id="out">実行中…</pre>
<iframe id="app" src="../../index.html?check=history-pin"></iframe>
<script>
(async function () {
  const out = document.getElementById('out');
  const log = [];
  const ok = (name, cond, extra) => log.push(`${cond ? 'OK ' : 'NG '} ${name}${extra != null ? ` (${extra})` : ''}`);
  const frame = document.getElementById('app');
  await new Promise((r) => frame.addEventListener('load', r, { once: true }));
  const win = frame.contentWindow;
  const errors = [];
  win.addEventListener('error', (e) => errors.push(e.message));
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  for (let i = 0; i < 50 && !(win.LyraMidi && win.LyraMidi.pickModel); i++) await wait(100);
  const doc = win.document;
  const waitFor = async (fn) => { for (let i = 0; i < 50 && !fn(); i++) await wait(100); return fn(); };
  try {
    win.localStorage.removeItem('lyra.modelFilter');
    win.eval('state.prefs.pinnedModels = []');
    const picked = win.LyraMidi.pickModel('確認');
    await wait(50);
    const modal = doc.querySelector('.model-picker');
    ok('ピッカーが開く', Boolean(modal));
    ok('最初はピン留めの見出しが無い', !modal.querySelector('.model-group--pinned'));

    modal.querySelector('[data-history-map]').click();
    const map = await waitFor(() => doc.querySelector('.history-map-overlay .history-map-row'));
    ok('音楽史マップが開く', Boolean(map));
    const overlay = doc.querySelector('.history-map-overlay');
    const rows = [...overlay.querySelectorAll('.history-map-row')];
    const pickable = rows.filter((r) => r.querySelector('[data-history-pick]'));
    const withPin = rows.filter((r) => r.querySelector('[data-pin]'));
    ok('「このモデルで作る」ができるモデル全部にピンがある', pickable.length > 60 && pickable.length === withPin.length, `${withPin.length} / ${pickable.length}`);
    ok('未作成のモデルにはピンが無い', !rows.filter((r) => !r.querySelector('.history-map-done')).some((r) => r.querySelector('[data-pin]')));

    overlay.querySelector('[data-pin="nocturne"]').click();
    await wait(30);
    ok('地図でピンを押すと押された見た目になる', overlay.querySelector('[data-pin="nocturne"]').classList.contains('is-pinned'));
    ok('ピンを押しても行は開かない', overlay.querySelector('[data-history-id="nocturne"] .history-map-detail').hidden);
    ok('ピンを押しても地図は閉じない', doc.body.contains(overlay));
    ok('state.prefs に残る', JSON.stringify(win.eval('state.prefs.pinnedModels')) === '["nocturne"]');
    overlay.querySelector('[data-pin="boids"]').click();
    await wait(30);

    overlay.querySelector('[data-history-filter="pinned"]').click();
    await wait(30);
    const shown = [...overlay.querySelectorAll('.history-map-row')].filter((r) => !r.hidden).map((r) => r.dataset.historyId);
    ok('地図の「ピン留め」でピン留めだけになる', shown.join(',') === 'nocturne,boids', shown.join(','));
    overlay.querySelector('[data-pin="boids"]').click();
    await wait(30);
    const shown2 = [...overlay.querySelectorAll('.history-map-row')].filter((r) => !r.hidden).map((r) => r.dataset.historyId);
    ok('地図の「ピン留め」の中で外すと消える', shown2.join(',') === 'nocturne', shown2.join(','));
    overlay.querySelector('[data-pin="boids"]') && overlay.querySelector('[data-history-filter="all"]').click();
    await wait(30);
    overlay.querySelector('[data-pin="ives"]').click();
    await wait(30);

    overlay.querySelector('[data-history-close]').click();
    await wait(50);
    ok('地図を閉じるとピッカーに戻る', !doc.body.contains(overlay) && doc.body.contains(modal));
    const pinnedGroup = modal.querySelector('.model-group--pinned');
    const pinnedIds = pinnedGroup ? [...pinnedGroup.querySelectorAll('[data-model]')].map((b) => b.dataset.model) : [];
    ok('地図で付けたピンが最初の窓のピン留めに出る', pinnedIds.join(',') === 'nocturne,ives', pinnedIds.join(','));
    ok('ピンの数が2', modal.querySelector('[data-pin-count]').textContent === '2');

    // 地図から選んだ時も、ピッカーごと閉じて選ばれる
    modal.querySelector('[data-history-map]').click();
    await waitFor(() => doc.querySelector('.history-map-overlay [data-history-id="waltz"]'));
    const o2 = doc.querySelector('.history-map-overlay');
    o2.querySelector('[data-history-id="waltz"] .history-map-toggle').click();
    await wait(30);
    let resolved = 'まだ';
    picked.then((id) => { resolved = id; });
    o2.querySelector('[data-history-id="waltz"] [data-history-pick]').click();
    await wait(50);
    ok('地図から選ぶと選ばれて全部閉じる', resolved === 'waltz' && !doc.body.contains(modal) && !doc.body.contains(o2), resolved);
    win.localStorage.removeItem('lyra.modelFilter');
    win.eval('state.prefs.pinnedModels = []');
  } catch (err) {
    log.push(`NG 例外: ${err.message}`);
  }
  ok('画面の読み込みエラーが無い', !errors.length, errors.join(' / '));
  const ng = log.filter((x) => x.startsWith('NG')).length;
  out.textContent = `結果: ${ng ? `NG ${ng} 件` : 'すべて OK'}\n` + log.join('\n');
  out.dataset.done = '1';
  if (/keep=1/.test(location.search)) {
    [...document.body.children].forEach((el) => { if (el !== frame) el.hidden = true; });
    document.body.style.margin = '0';
    frame.style.cssText = 'width:100vw;height:100vh;border:0;display:block';
    win.eval('state.prefs.pinnedModels = ["nocturne", "ives"]');
    win.LyraMidi.pickModel('どのモデルで作りますか?');
    await wait(50);
    doc.querySelector('[data-history-map]').click();
  }
})();
</script>
</body>
</html>
