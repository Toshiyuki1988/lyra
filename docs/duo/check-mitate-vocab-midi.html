<!doctype html><html lang="ja"><meta charset="utf-8"><title>見立て語彙 MIDI 検証</title>
<style>body{font:16px system-ui;max-width:1000px;margin:30px auto;background:#faf7f0;color:#252b30}button,select{font:inherit;padding:8px;margin:5px}pre{white-space:pre-wrap;background:#fff;padding:18px}canvas{width:100%;height:150px;border:1px solid #ccc}</style>
<h1>見立て語彙 MIDI 検証</h1><p>Gemini・Drive は模擬。音の写しと波形をアプリの JS で検証します。耳での確認は手動です。</p>
<select id="entry" aria-label="語彙"></select><button id="play">試聴</button><button id="stop">停止</button><button id="mute">消音切替</button><button id="solo">ソロ切替</button><button id="edit">音符を編集</button><button id="save">保存→読込</button><button id="remove">帳から外して振り直し</button><button id="wav">WAV</button><button id="mid">MIDI</button><button id="test">数値検証</button><p id="status" role="status">準備中</p><canvas id="wave" width="1000" height="150"></canvas><pre id="results"></pre>
<script>
window.state={prefs:{previewVolume:80}}; window.debugLog=console.log; window.setStatus=(s)=>document.querySelector('#status').textContent=s;
let testAudio; window.soundAudioCtx=()=>testAudio||(testAudio=new AudioContext());
let safeCalls=0; window.safeOut=(ctx)=>{safeCalls++;return ctx.destination;};
window.getCardById=()=>window.testCard; window.refreshEnsembleCard=()=>{};
</script>
