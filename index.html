<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LYRA</title>
<!-- JS/CSSを編集したら、対応するタグの ?v= を必ず新しい値に変更すること(キャッシュバスティング) -->
<link rel="stylesheet" href="css/style.css?v=20260925i">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  // URLに ?debug を付けたときだけ、画面下部にログを表示する簡易デバッグ機能。
  (function () {
    var enabled = location.search.includes('debug');
    var lines = [];
    var open = false;
    function render() {
      if (!enabled) return;
      var panel = document.getElementById('debug-log');
      var toggle = document.getElementById('debug-toggle');
      if (toggle) toggle.hidden = false;
      if (panel) {
        panel.hidden = !open;
        panel.textContent = lines.join('\n');
        if (open) panel.scrollTop = panel.scrollHeight;
      }
    }
    window.debugLog = function (msg) {
      if (!enabled) return;
      lines.push('[' + new Date().toLocaleTimeString() + '] ' + msg);
      render();
    };
    window.addEventListener('DOMContentLoaded', function () {
      var toggle = document.getElementById('debug-toggle');
      if (toggle) {
        toggle.addEventListener('click', function () {
          open = !open;
          render();
        });
      }
      render();
      window.debugLog('DOMContentLoaded');
    });
    window.addEventListener('error', function (e) {
      window.debugLog('ERROR: ' + e.message + ' (' + e.filename + ':' + e.lineno + ')');
    });
    window.addEventListener('unhandledrejection', function (e) {
      window.debugLog('UNHANDLED PROMISE REJECTION: ' + e.reason);
    });
  })();
</script>
</head>
<body>
  <header class="toolbar">
    <a class="brand" href="#/" title="はじめの画面へ">
      <span class="brand-orb"></span>
      <span class="brand-name">LYRA</span>
    </a>
    <nav id="crumbs" class="crumbs"></nav>
    <span id="status" class="status"></span>
    <!-- アンサンブルの舞台タブ(舞台のソウルが増えるたびに増える。js/app.jsのrenderEnsembleTabs()) -->
    <nav id="ensemble-tabs" class="ensemble-tabs" aria-label="アンサンブル"></nav>
    <div class="toolbar-actions">
      <button id="sign-in-btn" hidden>Googleでサインイン</button>
      <button id="sign-out-btn" class="secondary" hidden>サインアウト</button>
      <button id="settings-btn" class="secondary icon-btn" title="設定">⚙</button>
    </div>
    <div id="status-progress" class="status-progress" hidden><div id="status-progress-bar" class="status-progress-bar"></div></div>
  </header>

  <main id="stage" class="stage">
    <div class="stage-main">
      <div id="canvas-viewport" class="canvas-viewport">
        <div id="canvas-content" class="canvas-content"></div>
      </div>
      <!-- 画面ごとの浮遊UI(検索欄・タブなど)。キャンバスのズームの影響を受けない -->
      <div id="screen-overlay" class="screen-overlay"></div>
    </div>
    <!-- 右パネル(ソウル画面のパラメータ詳細など)。スマホでは下から出るシートになる -->
    <aside id="side-panel" class="side-panel" hidden></aside>
  </main>

  <nav id="bottombar" hidden></nav>

  <div id="settings-modal" class="modal-overlay">
    <div class="modal">
      <h2>設定</h2>
      <p class="modal-desc">
        LYRA用のGoogle OAuthクライアントIDとGemini APIキーを入力してください
        (CONSTELLATIONとは別のものを使います)。
        <strong>このブラウザにのみ保存され</strong>、外部に送信されることはありません
        (取得方法は README.md 参照)。
      </p>
      <label>
        Google OAuthクライアントID
        <input type="text" id="settings-client-id" placeholder="xxxxxxxx.apps.googleusercontent.com" autocomplete="off">
      </label>
      <label>
        Gemini APIキー(Auth Key)
        <input type="text" id="settings-api-key" placeholder="AQ.Ab8..." autocomplete="off">
      </label>
      <label id="settings-daily-row" class="modal-check" hidden>
        <input type="checkbox" id="settings-daily">
        毎日の課題(アプリから)をアンサンブル in コンサートホールに出す
      </label>
      <p id="settings-error" class="modal-error" hidden></p>
      <div class="modal-actions">
        <button id="settings-cancel-btn" class="secondary" hidden>キャンセル</button>
        <button id="settings-save-btn">保存</button>
      </div>
    </div>
  </div>

  <button id="debug-toggle" hidden title="デバッグログ">🐞</button>
  <pre id="debug-log" hidden></pre>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/interactjs@1.10.27/dist/interact.min.js"></script>
  <script src="js/config.js?v=20260924a"></script>
  <script src="js/auth.js?v=20260924a"></script>
  <script src="js/drive.js?v=20260924a"></script>
  <script src="js/gemini.js?v=20260925j"></script>
  <script src="js/sound.js?v=20260924a"></script>
  <script src="js/canvas.js?v=20260925a"></script>
  <script src="js/app.js?v=20260925h"></script>
  <script src="js/decompose.js?v=20260925k"></script>
  <script src="js/midi.js?v=20260925h"></script>
  <script src="js/audio.js?v=20260925b"></script>
  <script src="js/daily.js?v=20260925b"></script>
  <script src="js/screens/home.js?v=20260925h"></script>
  <script src="js/screens/soul.js?v=20260925g"></script>
  <script src="js/screens/ensemble.js?v=20260925i"></script>
</body>
</html>
