<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LYRA</title>
<!-- JS/CSSを編集したら、対応するタグの ?v= を必ず新しい値に変更すること(キャッシュバスティング) -->
<link rel="stylesheet" href="css/style.css?v=20260924a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<script>
  // URLに ?debug を付けたときだけ、画面下部にログを表示する簡易デバッグ機能。
  (function () {
    var enabled = location.search.includes('debug');
    var lines = [];
    var open = false;
    function render() {
      if (!enabled) return;
      var panel = document.getElementById('debug-log');
      var toggle = document.getElementById('debug-toggle');
      if (toggle) toggle.hidden = false;
      if (panel) {
        panel.hidden = !open;
        panel.textContent = lines.join('\n');
        if (open) panel.scrollTop = panel.scrollHeight;
      }
    }
    window.debugLog = function (msg) {
      if (!enabled) return;
      lines.push('[' + new Date().toLocaleTimeString() + '] ' + msg);
      render();
    };
    window.addEventListener('DOMContentLoaded', function () {
      var toggle = document.getElementById('debug-toggle');
      if (toggle) {
        toggle.addEventListener('click', function () {
          open = !open;
          render();
        });
      }
      render();
      window.debugLog('DOMContentLoaded');
    });
    window.addEventListener('error', function (e) {
      window.debugLog('ERROR: ' + e.message + ' (' + e.filename + ':' + e.lineno + ')');
    });
    window.addEventListener('unhandledrejection', function (e) {
      window.debugLog('UNHANDLED PROMISE REJECTION: ' + e.reason);
    });
  })();
</script>
</head>
<body>
  <header class="toolbar">
    <h1>LYRA</h1>
    <div class="toolbar-actions">
      <button id="sign-in-btn" hidden>Googleでサインイン</button>
      <button id="sign-out-btn" class="secondary" hidden>サインアウト</button>
      <button id="settings-btn" class="secondary" title="設定">⚙</button>
    </div>
    <span id="status" class="status"></span>
    <div id="status-progress" class="status-progress" hidden><div id="status-progress-bar" class="status-progress-bar"></div></div>
  </header>

  <div id="canvas-viewport" class="canvas-viewport">
    <div id="canvas-content" class="canvas-content"></div>
  </div>

  <nav id="bottombar">
    <button id="tool-text" class="tool-btn" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6h14M12 6v13M9 19h6"/></svg>
      テキスト
    </button>
  </nav>

  <div id="settings-modal" class="modal-overlay">
    <div class="modal">
      <h2>初期設定</h2>
      <p class="modal-desc">
        LYRA用のGoogle OAuthクライアントIDとGemini APIキーを入力してください
        (CONSTELLATIONとは別のものを使います)。
        <strong>このブラウザにのみ保存され</strong>、外部に送信されることはありません
        (取得方法は README.md 参照)。
      </p>
      <label>
        Google OAuthクライアントID
        <input type="text" id="settings-client-id" placeholder="xxxxxxxx.apps.googleusercontent.com" autocomplete="off">
      </label>
      <label>
        Gemini APIキー(Auth Key)
        <input type="text" id="settings-api-key" placeholder="AQ.Ab8..." autocomplete="off">
      </label>
      <p id="settings-error" class="modal-error" hidden></p>
      <div class="modal-actions">
        <button id="settings-cancel-btn" class="secondary" hidden>キャンセル</button>
        <button id="settings-save-btn">保存</button>
      </div>
    </div>
  </div>

  <button id="debug-toggle" hidden title="デバッグログ">🐞</button>
  <pre id="debug-log" hidden></pre>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/interactjs@1.10.27/dist/interact.min.js"></script>
  <script src="js/config.js?v=20260924a"></script>
  <script src="js/auth.js?v=20260924a"></script>
  <script src="js/drive.js?v=20260924a"></script>
  <script src="js/gemini.js?v=20260924a"></script>
  <script src="js/sound.js?v=20260924a"></script>
  <script src="js/canvas.js?v=20260924a"></script>
  <script src="js/app.js?v=20260924a"></script>
</body>
</html>
